plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    implementation project(':ShimePluginLibrary')
    implementation project(':ShimePluginCommand')
    implementation project(':ShimePluginNMS')
    compileOnly "io.papermc.paper:paper-api:${rootProject.ext.paperVersion}"
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
