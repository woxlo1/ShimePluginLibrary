plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

ext {
    paperVersion = '1.20.6-R0.1-SNAPSHOT'
    kotlinVersion = '2.0.21'
    junitVersion = '5.10.2'
}

allprojects {
    group = 'shimeserver'
    version = rootProject.findProperty('releaseVersion') ?: '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
            freeCompilerArgs.add('-Xjvm-default=all')
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }

    dependencies {
        testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${rootProject.ext.kotlinVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

configure(subprojects.findAll { it.name in ['ShimePluginLibrary', 'ShimePluginCommand', 'ShimePluginNMS'] }) {
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
    }

    def githubUser = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
    def githubToken = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = project.name

                pom {
                    name = project.name
                    description = "ShimePluginLibrary module: ${project.name}"
                    url = 'https://github.com/woxlo1/ShimePluginLibrary'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/woxlo1/ShimePluginLibrary.git'
                        developerConnection = 'scm:git:ssh://git@github.com/woxlo1/ShimePluginLibrary.git'
                        url = 'https://github.com/woxlo1/ShimePluginLibrary'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/woxlo1/ShimePluginLibrary')

                if (githubUser != null && githubToken != null) {
                    credentials {
                        username = githubUser.toString()
                        password = githubToken.toString()
                    }
                }
            }
        }
    }
}
