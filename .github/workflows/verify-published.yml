name: Verify Published Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: '検証する公開バージョン（例: 1.1.0）'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve published artifacts from GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew
          -p examples/consumer-plugin
          build
          --console=plain --no-daemon
          --project-prop shimeArtifactSource=github
          --project-prop shimeVersion=${{ inputs.version }}
